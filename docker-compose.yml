services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: taskboard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=task-board
    volumes:
      - mongo-data:/data/db
    networks:
      - taskboard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Node.js Backend (Express + Socket.io + Yjs CRDT)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskboard-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task-board
      - JWT_SECRET=super_secret_jwt_neon_board_key_2026
      - CLIENT_URL=http://localhost:80
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskboard-net

  # 3. Frontend Client (Vite React + Tailwind + Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskboard-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - taskboard-net

networks:
  taskboard-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
